<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sangam CMS Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sangam-navy: #0a2540;
      --sangam-navy-dark: #061729;
      --sangam-emerald: #00b894;
      --sangam-emerald-dark: #008b6f;
      --sangam-bg: #f4f7fa;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--sangam-bg);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle top accent bar above Decap CMS */
    body::before {
      content: "";
      display: block;
      height: 4px;
      width: 100%;
      background: linear-gradient(90deg, var(--sangam-navy) 0%, var(--sangam-emerald) 100%);
    }

    /* Polish primary action buttons without overriding modal/editor positioning */
    [class*="AppHeader"] {
      background-color: var(--sangam-navy) !important;
      box-shadow: 0 8px 24px rgba(6, 23, 41, 0.14) !important;
    }

    [class*="AppHeader"] a,
    [class*="AppHeader"] button {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-weight: 600 !important;
    }

    button[class*="PublishButton"],
    button[class*="SaveButton"],
    a[class*="NewButton"],
    button[class*="LoginButton"] {
      background-color: var(--sangam-emerald) !important;
      border-color: var(--sangam-emerald) !important;
      color: #061729 !important;
      font-weight: 700 !important;
      border-radius: 10px !important;
      transition: transform 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease !important;
    }

    button[class*="PublishButton"]:hover,
    button[class*="SaveButton"]:hover,
    a[class*="NewButton"]:hover,
    button[class*="LoginButton"]:hover {
      background-color: var(--sangam-emerald-dark) !important;
      border-color: var(--sangam-emerald-dark) !important;
      color: #ffffff !important;
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(0, 184, 148, 0.25) !important;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.CMS && typeof window.CMS.registerPreviewStyle === 'function') {
        const previewCss = `
          body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #1e293b;
            background: #f8fafc;
            padding: 28px;
            line-height: 1.65;
          }
          h1, h2, h3 {
            color: #0a2540;
            font-weight: 800;
            letter-spacing: -0.02em;
          }
          img {
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 12px 24px rgba(10, 37, 64, 0.12);
          }
        `;
        const blob = new Blob([previewCss], { type: 'text/css' });
        const styleUrl = URL.createObjectURL(blob);
        window.CMS.registerPreviewStyle(styleUrl);
      }
    });
  </script>
</body>
</html>
