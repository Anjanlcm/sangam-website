<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All News & Notices | Sangam Management Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 50: '#f0f4f8', 100: '#d9e2ec', 800: '#102a43', 900: '#0a2540', 950: '#061729' },
                        emerald: { 500: '#00b894', 600: '#00a383', 700: '#008b6f' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>.card-hover { transition: all 0.3s ease; } .card-hover:hover { transform: translateY(-4px); box-shadow: 0 15px 25px -5px rgba(0,0,0,0.1); }</style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased">
    <!-- Navigation Header -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-20">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-12 h-12 bg-navy-900 rounded-xl flex items-center justify-center text-emerald-500 font-bold text-2xl"><i class="fa-solid fa-graduation-cap"></i></div>
                <div><span class="block text-xl font-extrabold text-navy-900 leading-none">SANGAM</span><span class="text-[11px] font-bold text-slate-500 uppercase tracking-widest">Management Service</span></div>
            </a>
            <nav class="hidden md:flex items-center gap-7 font-medium text-slate-600 text-sm">
                <a href="index.html" class="hover:text-navy-900">Home</a>
                <a href="news.html" class="text-emerald-600 font-semibold">All News</a>
                <a href="gallery.html" class="hover:text-navy-900">Full Gallery</a>
            </nav>
            <a href="index.html#contact" class="bg-navy-900 text-white text-xs font-semibold px-4 py-2.5 rounded-lg">Contact Us</a>
        </div>
    </header>

    <!-- Page Header -->
    <section class="bg-navy-900 text-white py-16 text-center">
        <h1 class="text-3xl sm:text-4xl font-extrabold">All News & Announcements</h1>
        <p class="text-slate-300 text-sm mt-2">Browse all published notices, admission updates, and institutional announcements.</p>
    </section>

    <!-- Full News Grid -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div id="full-news-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
            <p class="text-sm text-slate-500 italic">Loading announcements...</p>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-navy-950 text-slate-400 text-xs py-8 text-center border-t border-navy-900">
        <p>&copy; 2026 Sangam Management Service. All Rights Reserved.</p>
    </footer>

    <script>
        async function loadAllNews() {
            try {
                const res = await fetch('https://api.github.com/repos/Anjanlcm/sangam-website/contents/data/news');
                const files = await res.json();
                const container = document.getElementById('full-news-container');
                if (container && Array.isArray(files)) {
                    container.innerHTML = '';
                    for (const file of files) {
                        if (file.name.endsWith('.json')) {
                            const item = await (await fetch(file.download_url)).json();
                            container.innerHTML += `
                                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm card-hover flex flex-col justify-between">
                                    <div>
                                        ${item.image ? `<img src="${item.image}" class="w-full h-48 object-cover rounded-xl mb-4" alt="News Image">` : ''}
                                        <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-md">${item.date || 'Notice'}</span>
                                        <h3 class="text-lg font-bold text-navy-900 mt-3 mb-2">${item.title}</h3>
                                        <p class="text-sm text-slate-600 leading-relaxed">${item.description}</p>
                                    </div>
                                </div>
                            `;
                        }
                    }
                }
            } catch (e) { document.getElementById('full-news-container').innerHTML = '<p class="text-sm text-slate-500">No news articles published yet.</p>'; }
        }
        loadAllNews();
    </script>
</body>
</html>
